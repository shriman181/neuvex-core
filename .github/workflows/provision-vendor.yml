name: Provision vendor

# Gives a vendor its own Neon project, or brings an existing one up to date: creates
# the project, applies the vendor template to production and fixtures, and stores the
# gateway's login encrypted in the control plane. Safe to run again; a failed run
# picks up where it stopped. Started by hand from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Vendor slug (must already exist in control.vendors)"
        required: true
        type: string
      region:
        description: "Neon region for a new project (ignored if it exists)"
        required: false
        type: choice
        default: aws-ap-southeast-1
        options:
          - aws-ap-southeast-1
          - aws-us-east-1
          - aws-us-east-2
          - aws-us-west-2
          - aws-eu-central-1
          - aws-eu-west-2
          - aws-ap-southeast-2
          - aws-sa-east-1
          - azure-eastus2
          - azure-westus3
          - azure-gwc

concurrency:
  group: provision-${{ inputs.slug }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Provision
        env:
          SLUG: ${{ inputs.slug }}
          REGION: ${{ inputs.region }}
          NEON_API_KEY: ${{ secrets.NEON_ORG_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          DATABASE_URL: ${{ secrets.PROVISIONER_DATABASE_URL }}
          VENDOR_DB_KEY: ${{ secrets.VENDOR_DB_KEY }}
        run: npm run provision -w @neuvex/provisioner -- "$SLUG" --region "$REGION"
