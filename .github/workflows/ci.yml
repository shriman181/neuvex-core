name: CI

# Typecheck and tests for every package, on every pull request and on main.
# Everything runs on in-memory Postgres; nothing here touches Neon or Cloudflare.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check migration files
        run: npm run db:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundle the gateway Worker
        working-directory: apps/gateway
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Bundle the Playground Worker
        working-directory: apps/playground
        run: npx wrangler deploy --dry-run --outdir dist
